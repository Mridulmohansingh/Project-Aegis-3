apiVersion: v1
kind: Namespace
metadata:
  name: aegis
  labels:
    name: aegis
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aegis-quota
  namespace: aegis
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "200"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: aegis-limit-range
  namespace: aegis
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
    type: Container
