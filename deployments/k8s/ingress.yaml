apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-ingress
  namespace: aegis
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-rpm: "6000"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://aegis-platform.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - api.aegis-platform.com
    secretName: aegis-tls-secret
  rules:
  - host: api.aegis-platform.com
    http:
      paths:
      - path: /api/v1/items
        pathType: Prefix
        backend:
          service:
            name: question-bank-svc
            port:
              number: 8080
      - path: /api/v1/sessions
        pathType: Prefix
        backend:
          service:
            name: exam-delivery-svc
            port:
              number: 8080
