apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  FEATURE_FLAG_NEW_UI: "false"
  FEATURE_FLAG_BETA_API: "false"
  KAFKA_BROKERS: "kafka.aegis-platform.internal:9092"
  REDIS_HOST: "redis.aegis-platform.internal"
  REDIS_PORT: "6379"
