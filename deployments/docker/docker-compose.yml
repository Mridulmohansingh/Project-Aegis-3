# ──────────────────────────────────────────────
#  Project AEGIS — Local Development Environment
# ──────────────────────────────────────────────
# Start:  docker compose -f deployments/docker/docker-compose.yml up -d
# Stop:   docker compose -f deployments/docker/docker-compose.yml down
# Logs:   docker compose -f deployments/docker/docker-compose.yml logs -f
# Reset:  docker compose -f deployments/docker/docker-compose.yml down -v

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Apache Kafka (KRaft mode, no Zookeeper) ─
  kafka:
    image: bitnami/kafka:3.7
    container_name: aegis-kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Keycloak (Identity Provider) ────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aegis-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aegis
      KC_DB_USERNAME: aegis
      KC_DB_PASSWORD: aegis_dev_password
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── OpenSearch (Search & Analytics) ─────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: aegis-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  # ── Prometheus (Metrics) ────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: aegis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ── Grafana (Dashboards) ────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: aegis-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── OPA (Policy Engine) ─────────────────────
  opa:
    image: openpolicyagent/opa:0.64.1
    container_name: aegis-opa
    command: run --server --log-level debug /policies
    ports:
      - "8181:8181"
    volumes:
      - ../../policies:/policies:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
