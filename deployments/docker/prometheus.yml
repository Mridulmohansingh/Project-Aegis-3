# Prometheus configuration for AEGIS local development
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aegis-question-bank"
    static_configs:
      - targets: ["host.docker.internal:9090"]
    metrics_path: "/metrics"

  - job_name: "aegis-exam-delivery"
    static_configs:
      - targets: ["host.docker.internal:9091"]
    metrics_path: "/metrics"
