# AEGIS Development Configuration
# Override any value with environment variables: AEGIS_SECTION_KEY
# e.g., AEGIS_DATABASE_PASSWORD=mysecret

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_request_size: 10485760  # 10MB

database:
  host: "localhost"
  port: 5432
  user: "aegis"
  password: "aegis_dev_password"  # Override in production
  dbname: "aegis"
  ssl_mode: "disable"  # Use 'require' in production
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m
  migrations_path: "./migrations"

redis:
  addresses:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 50
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

kafka:
  brokers:
    - "localhost:9092"
  group_id: "aegis-question-bank"
  security_protocol: "PLAINTEXT"  # Use 'SASL_SSL' in production

auth:
  jwt_issuer: "aegis-dev"
  jwt_audience: "aegis-api"
  jwks_url: "http://localhost:8180/realms/aegis/protocol/openid-connect/certs"
  access_token_ttl: 15m
  refresh_token_ttl: 24h
  opa_endpoint: "http://localhost:8181/v1/data/aegis"

vault:
  address: "http://localhost:8200"
  token: "dev-root-token"
  mount_path: "secret"
  namespace: ""

observability:
  metrics_port: 9090
  metrics_path: "/metrics"
  tracing_enabled: false
  otlp_endpoint: "localhost:4317"

logging:
  level: "debug"
  environment: "development"
